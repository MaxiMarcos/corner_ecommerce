<div class="card" [routerLink]="['/product', product.id]">
  <div class="card-image-container">
    <img 
      [src]="product.imageUrl || 'assets/placeholder.jpg'" 
      [alt]="product.name"
      class="card-image"
      loading="lazy"
    >
    <div class="card-badges">
      <span *ngIf="product.totalStock === 0" class="badge badge-danger">Agotado</span>
      <span *ngIf="product.lowStock && product.totalStock > 0" class="badge badge-warning">Poco stock</span>
    </div>
  </div>
  
  <div class="card-content">
    <h3 class="product-name font-semibold">{{ product.name }}</h3>
    
    <div class="product-price">
      <ng-container *ngIf="minPrice === maxPrice; else priceRange">
        <span class="price font-bold text-lg">{{ minPrice | currency }}</span>
      </ng-container>
      <ng-template #priceRange>
        <span class="price text-muted text-sm">Desde</span>
        <span class="price font-bold text-lg">{{ minPrice | currency }}</span>
      </ng-template>
    </div>
  </div>
</div>
