<div class="cart-overlay" *ngIf="cartService.isCartOpen()" (click)="cartService.closeCart()"></div>
<div class="cart-panel" [class.open]="cartService.isCartOpen()">
  <div class="cart-header">
    <h2>Tu Carrito ({{ cartService.totalItems() }})</h2>
    <button class="close-btn" (click)="cartService.closeCart()" aria-label="Cerrar">&times;</button>
  </div>

  <div class="cart-body">
    <div *ngIf="cartService.cartItems().length === 0" class="empty-cart">
      <p>No hay productos en el carrito.</p>
    </div>

    <div class="cart-items" *ngIf="cartService.cartItems().length > 0">
      <div class="cart-item" *ngFor="let item of cartService.cartItems()">
        <img [src]="item.product.imageUrl || 'assets/placeholder.jpg'" [alt]="item.product.name" class="item-img">
        
        <div class="item-details">
          <h4 class="item-title">{{ item.product.name }}</h4>
          <p class="item-variant">{{ item.variant.size }} - {{ item.variant.color }}</p>
          <p class="item-price">${{ item.variant.salePrice | number }}</p>
          
          <div class="item-actions">
            <div class="qty-control">
              <button (click)="cartService.updateQuantity(item.variant.id, item.quantity - 1)">-</button>
              <span>{{ item.quantity }}</span>
              <button (click)="cartService.updateQuantity(item.variant.id, item.quantity + 1)" [disabled]="item.quantity >= item.variant.stock">+</button>
            </div>
            
            <button class="remove-btn" (click)="cartService.removeFromCart(item.variant.id)" aria-label="Eliminar">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="cart-footer" *ngIf="cartService.cartItems().length > 0">
    <div class="total-row">
      <span>Total:</span>
      <span class="total-price">${{ cartService.totalPrice() | number }}</span>
    </div>
    
    <button 
      class="btn-primary w-full checkout-btn" 
      [disabled]="isProcessingPayment"
      (click)="checkout()">
      {{ isProcessingPayment ? 'Procesando...' : 'Comprar con Mercado Pago' }}
    </button>
  </div>
</div>
