<header class="header">
  <div class="container header-content">
    <a routerLink="/" class="logo flex items-center gap-2">
      <div class="logo-icon"></div>
      <span class="font-bold text-xl">Corner</span>
    </a>

    <div class="search-bar">
      <input type="text" placeholder="Buscar productos..." class="search-input" #searchInput
        (keyup.enter)="onSearch($event, searchInput.value)">
      <button class="btn-primary search-btn" (click)="onSearch($event, searchInput.value)">Buscar</button>
    </div>

    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle navigation">
      <svg *ngIf="!isMenuOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <svg *ngIf="isMenuOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <nav class="nav-links" [class.active]="isMenuOpen">
      <div class="dropdown">
        <a class="dropdown-toggle" routerLink="/" [queryParams]="{categoryId: getCategoryId('Equipos Internacionales')}">Equipos Internacionales</a>
        <div class="dropdown-menu">
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('Equipos Internacionales'), subCategoryId: getSubCategoryId('Camisetas')}">Camisetas</a>
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('Equipos Internacionales'), subCategoryId: getSubCategoryId('Shorts')}">Shorts</a>
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('Equipos Internacionales'), subCategoryId: getSubCategoryId('Camperas')}">Camperas</a>
        </div>
      </div>

      <div class="dropdown">
        <a class="dropdown-toggle" routerLink="/" [queryParams]="{categoryId: getCategoryId('Equipos Nacionales')}">Equipos Nacionales</a>
        <div class="dropdown-menu">
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('Equipos Nacionales'), subCategoryId: getSubCategoryId('Camisetas')}">Camisetas</a>
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('Equipos Nacionales'), subCategoryId: getSubCategoryId('Shorts')}">Shorts</a>
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('Equipos Nacionales'), subCategoryId: getSubCategoryId('Camperas')}">Camperas</a>
        </div>
      </div>

      <div class="dropdown">
        <a class="dropdown-toggle" routerLink="/" [queryParams]="{categoryId: getCategoryId('Selecciones')}">Selecciones</a>
        <div class="dropdown-menu">
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('Selecciones'), subCategoryId: getSubCategoryId('Camisetas')}">Camisetas</a>
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('Selecciones'), subCategoryId: getSubCategoryId('Shorts')}">Shorts</a>
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('Selecciones'), subCategoryId: getSubCategoryId('Camperas')}">Camperas</a>
        </div>
      </div>

      <div class="dropdown">
        <a class="dropdown-toggle" routerLink="/">Más</a>
        <div class="dropdown-menu">
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('LEVIS')}">LEVIS</a>
          <a routerLink="/" [queryParams]="{categoryId: getCategoryId('ADIDAS')}">ADIDAS</a>
        </div>
      </div>
    </nav>
  </div>
</header>
