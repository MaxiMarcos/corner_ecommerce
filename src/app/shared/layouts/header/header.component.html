<header class="header">
  <div class="container header-content">
    <a routerLink="/" class="logo flex items-center gap-2">
      <div class="logo-icon"></div>
      <span class="font-bold text-xl">Corner</span>
    </a>
    
    <div class="search-bar">
      <input 
        type="text" 
        placeholder="Buscar productos..." 
        class="search-input"
        #searchInput
        (keyup.enter)="onSearch($event, searchInput.value)"
      >
      <button class="btn-primary search-btn" (click)="onSearch($event, searchInput.value)">Buscar</button>
    </div>
    
    <nav class="nav-links">
      <a routerLink="/">Catálogo</a>
      <a routerLink="/about" class="text-muted">Nosotros</a>
    </nav>
  </div>
</header>
