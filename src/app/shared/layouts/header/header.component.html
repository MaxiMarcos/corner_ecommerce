<div class="promo-banner" style="background-color: var(--primary); color: white; text-align: center; padding: 8px; font-size: 14px; font-weight: bold; width: 100%;">
  🔥 ¡Llevando 3 o más prendas tenés un 20% de descuento en tu compra! 🔥
</div>
<header class="header">
  <div class="container header-content">
    <a routerLink="/" class="logo flex items-center gap-2">
      <!-- <div class="logo-icon"></div> ACA IRIA EL LOGO --> 
      <span class="font-bold text-xl">CORNER</span>
    </a>

    <div class="search-bar">
      <input type="text" placeholder="Buscar productos..." class="search-input" #searchInput
        (keyup.enter)="onSearch($event, searchInput.value)">
      <button class="btn-primary search-btn" (click)="onSearch($event, searchInput.value)">Buscar</button>
    </div>

    <nav class="nav-links" [class.active]="isMenuOpen">
      <div class="dropdown">
        <a class="dropdown-toggle" routerLink="/" [queryParams]="{categoria: 'equipos-internacionales'}">Equipos Internacionales</a>
        <div class="dropdown-menu">
          <a routerLink="/" [queryParams]="{categoria: 'equipos-internacionales', subcategoria: 'camisetas'}">Camisetas</a>
          <a routerLink="/" [queryParams]="{categoria: 'equipos-internacionales', subcategoria: 'shorts'}">Shorts</a>
          <a routerLink="/" [queryParams]="{categoria: 'equipos-internacionales', subcategoria: 'camperas'}">Camperas</a>
        </div>
      </div>

      <div class="dropdown">
        <a class="dropdown-toggle" routerLink="/" [queryParams]="{categoria: 'equipos-nacionales'}">Equipos Nacionales</a>
        <div class="dropdown-menu">
          <a routerLink="/" [queryParams]="{categoria: 'equipos-nacionales', subcategoria: 'camisetas'}">Camisetas</a>
          <a routerLink="/" [queryParams]="{categoria: 'equipos-nacionales', subcategoria: 'shorts'}">Shorts</a>
          <a routerLink="/" [queryParams]="{categoria: 'equipos-nacionales', subcategoria: 'camperas'}">Camperas</a>
        </div>
      </div>

      <div class="dropdown">
        <a class="dropdown-toggle" routerLink="/" [queryParams]="{categoria: 'selecciones'}">Selecciones</a>
        <div class="dropdown-menu">
          <a routerLink="/" [queryParams]="{categoria: 'selecciones', subcategoria: 'camisetas'}">Camisetas</a>
          <a routerLink="/" [queryParams]="{categoria: 'selecciones', subcategoria: 'shorts'}">Shorts</a>
          <a routerLink="/" [queryParams]="{categoria: 'selecciones', subcategoria: 'camperas'}">Camperas</a>
        </div>
      </div>

      <div class="dropdown">
        <a class="dropdown-toggle" routerLink="/">Más</a>
        <div class="dropdown-menu">
          <a routerLink="/" [queryParams]="{categoria: 'levis'}">LEVIS</a>
          <a routerLink="/" [queryParams]="{categoria: 'adidas'}">ADIDAS</a>
        </div>
      </div>
    </nav>

    <div class="header-actions" style="display: flex; align-items: center; gap: 1rem;">
      <button class="cart-toggle" (click)="cartService.toggleCart()" aria-label="Carrito" style="position: relative; background: none; border: none; cursor: pointer; color: var(--text);">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span *ngIf="cartService.totalItems() > 0" class="cart-badge" style="position: absolute; top: -8px; right: -8px; background-color: var(--primary); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">
          {{ cartService.totalItems() }}
        </span>
      </button>

      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle navigation">
        <svg *ngIf="!isMenuOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg *ngIf="isMenuOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>
