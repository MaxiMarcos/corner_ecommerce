<footer class="footer">
  <div class="container footer-content">
    
    <!-- Sección Contáctanos -->
    <div class="footer-section">
      <h3 class="footer-title">Contáctanos</h3>
      <div class="social-links">
        <a [href]="instagramUrl" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span>{{ instagramUser }}</span>
        </a>
        
        <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="WhatsApp">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <span>351 5637590</span>
        </a>
      </div>
    </div>

    <!-- Sección Visítanos -->
    <div class="footer-section">
      <h3 class="footer-title">Visítanos</h3>
      <div class="address-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <p>Manzana 67, Lote 3 (Local N°2), Barrio Docta Urbanización, Córdoba Capital.</p>
      </div>
    </div>

  </div>
  
  <!-- Derechos reservados -->
  <div class="footer-bottom">
    <p>&copy; {{ year }} Corner. Todos los derechos reservados.</p>
  </div>
</footer>
