    <h4 class="font-medium">Color: <span class="text-muted">{{ selectedColor || 'Seleccionar' }}</span></h4>
    <div class="options flex gap-2">
      <button 
        *ngFor="let color of colors"
        class="option-btn"
        [class.selected]="selectedColor === color"
        (click)="selectColor(color)">
        {{ color }}
      </button>
    </div>
  </div> -->

  <div class="option-group" *ngIf="sizes.length > 0">
    <h4 class="font-medium">Talle: <span class="text-muted">{{ selectedSize || 'Seleccionar' }}</span></h4>
    <div class="options flex gap-2">
      <button 
        *ngFor="let size of sizes"
        class="option-btn"
        [class.selected]="selectedSize === size"
        (click)="selectSize(size)">
        {{ size }}
      </button>
    </div>
  </div>

  <div class="variant-result" *ngIf="selectedColor && selectedSize">
    <ng-container *ngIf="selectedVariant; else notFound">
      <div class="price font-bold text-2xl">
        {{ selectedVariant.salePrice | currency }}
      </div>
      <p class="stock-info" [class.text-danger]="selectedVariant.stock === 0">
        {{ selectedVariant.stock > 0 ? selectedVariant.stock + ' disponibles' : 'Agotado' }}
      </p>
    </ng-container>
    <ng-template #notFound>
      <p class="text-muted">Esta combinación no está disponible.</p>
    </ng-template>
  </div>
</div>
