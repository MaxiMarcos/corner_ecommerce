<!-- Hero Carousel -->
<div class="hero-carousel">
  <div class="carousel-slide" *ngFor="let image of carouselImages; let i = index" [class.active]="i === currentCarouselIndex">
    <div class="carousel-overlay"></div>
    <img [src]="image" alt="Carousel image" class="carousel-image">
  </div>
  
  <div class="carousel-content">
    <h1 class="hero-title">Indumentaria Corner</h1>
    <p class="hero-subtitle">Fútbol y estilo</p>
  </div>
  
  <div class="carousel-indicators">
    <span class="indicator" *ngFor="let img of carouselImages; let i = index" [class.active]="i === currentCarouselIndex" (click)="currentCarouselIndex = i"></span>
  </div>
</div>

<div id="catalog-header" class="catalog-header container">
  <h2 class="text-3xl font-bold mt-8">Últimos Productos</h2>
  <p class="text-muted">Descubre nuestra colección de ropa.</p>
</div>

<div class="catalog-layout container">
  <!-- Main Content -->
  <main class="catalog-content">
    <div *ngIf="error" class="error-state">
      <p class="text-danger font-medium text-lg">Hubo un error al cargar los productos. Por favor intenta de nuevo.</p>
    </div>

    <app-product-grid 
      *ngIf="!error" 
      [products]="products" 
      [isLoading]="isLoading">
    </app-product-grid>

    <!-- Pagination Controls -->
    <div class="pagination-controls" *ngIf="!isLoading && !error && totalPages > 1">
      <button 
        class="btn-secondary" 
        [disabled]="currentPage === 0"
        (click)="goToPage(currentPage - 1)">
        Anterior
      </button>
      
      <span class="page-info text-muted">
        Página {{ currentPage + 1 }} de {{ totalPages }}
      </span>

      <button 
        class="btn-secondary" 
        [disabled]="currentPage >= totalPages - 1"
        (click)="goToPage(currentPage + 1)">
        Siguiente
      </button>
    </div>
  </main>
</div>
