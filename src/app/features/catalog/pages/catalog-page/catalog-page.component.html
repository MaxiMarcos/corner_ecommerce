<div class="catalog-header">
  <h1 class="text-3xl font-bold">Últimos Productos</h1>
  <p class="text-muted">Descubre nuestra colección premium de ropa.</p>
</div>

<div class="catalog-layout">
  <!-- Main Content -->
  <main class="catalog-content">
    <div *ngIf="error" class="error-state">
      <p class="text-danger font-medium text-lg">Hubo un error al cargar los productos. Por favor intenta de nuevo.</p>
    </div>

    <app-product-grid 
      *ngIf="!error" 
      [products]="products" 
      [isLoading]="isLoading">
    </app-product-grid>

    <!-- Pagination Controls -->
    <div class="pagination-controls" *ngIf="!isLoading && !error && totalPages > 1">
      <button 
        class="btn-secondary" 
        [disabled]="currentPage === 0"
        (click)="goToPage(currentPage - 1)">
        Anterior
      </button>
      
      <span class="page-info text-muted">
        Página {{ currentPage + 1 }} de {{ totalPages }}
      </span>

      <button 
        class="btn-secondary" 
        [disabled]="currentPage >= totalPages - 1"
        (click)="goToPage(currentPage + 1)">
        Siguiente
      </button>
    </div>
  </main>
</div>
