<div *ngIf="isLoading" class="loading-state">
  <p class="text-muted text-lg">Cargando catálogo...</p>
</div>

<div *ngIf="!isLoading && products.length === 0" class="empty-state">
  <p class="text-muted text-lg">No se encontraron productos.</p>
</div>

<div *ngIf="!isLoading && products.length > 0" class="product-grid">
  <app-product-card 
    *ngFor="let product of products" 
    [product]="product">
  </app-product-card>
</div>
